name: deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Remote Host
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Create docker-compose.yml with secrets
      run: |
        export TG_TOKEN="${{ secrets.TG_TOKEN }}"
        export VK_TOKEN="${{ secrets.VK_TOKEN }}"
        export VK_GROUP="${{ secrets.VK_GROUP }}"
        export PUBLIC_IP="${{ secrets.SSH_HOST }}"
        envsubst < docker-compose-template.yml > docker-compose.yml

    - name: Install SSH key
      run: |
        install -m 600 -D /dev/null ~/.ssh/id_rsa
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts

    - name: Install packages
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          set -e
    
          apt-get update
          apt-get install -y ca-certificates curl gnupg rsync
    
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
    
          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] \
            https://download.docker.com/linux/debian \
            $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            > /etc/apt/sources.list.d/docker.list
    
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
    
          systemctl enable --now docker
    
          docker version
          docker compose version
        EOF

    - name: Sync files
      id: sync
      run: |
        set -e

        CHANGES=$(rsync -azc --itemize-changes \
        --exclude '.git' \
        --exclude '.gitignore' \
        --exclude '.github' \
        ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/project/)

        echo "$CHANGES"
        
        REBUILD_CHANGES=$(echo "$CHANGES" | grep -vE '^\.' || true)
        
        echo "$REBUILD_CHANGES"

        if [ -n "$REBUILD_CHANGES" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build and run Docker container on remote host
      if: steps.sync.outputs.changed == 'true'
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd ~/project
          docker compose down
          docker compose build
          docker compose up -d
        EOF

    - name: Cleanup
      if: always()
      run: rm -rf ~/.ssh docker-compose.yml
