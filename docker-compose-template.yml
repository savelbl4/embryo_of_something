services:
  bot:
    build: .
    container_name: telegram_vk_bot
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - TG_TOKEN=${TG_TOKEN}
      - VK_TOKEN=${VK_TOKEN}
      - VK_GROUP=${VK_GROUP}
      - PUBLIC_IP=${PUBLIC_IP}
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
